# SepiaOS networking, read at boot by /usr/sbin/sepia-network and rewritten by
# its commands - so this can be edited by hand or driven by:
#
#   sepia-network status
#   sepia-network ethernet dhcp
#   sepia-network ethernet static 192.168.1.50/24 192.168.1.1 1.1.1.1
#   sepia-network wifi 'my network' 'the passphrase' DE
#   sepia-network wifi off
#
# Each interface is off, on dhcp or on a static address, independently of the
# other: "ethernet or wifi or both" is what falls out of the two being separate.
#
# This file holds the wifi passphrase, so it is mode 0600 and owned by root.

# dhcp, static or off.
ETHERNET="dhcp"

# Read only when ETHERNET is static. The address carries its prefix length;
# ETH_DNS is a space-separated list.
ETH_ADDRESS=""
ETH_GATEWAY=""
ETH_DNS=""

# dhcp, static or off. Wifi needs the Broadcom firmware and wpa_supplicant;
# `sepia-network status` says so plainly when either is missing.
WIFI="off"
WIFI_SSID=""
WIFI_PSK=""

# The regulatory domain, as a two-letter country code (DE, GB, US...). Without
# one the radio is held to the channels that are legal everywhere, which on
# 5 GHz is most of them.
WIFI_COUNTRY=""

# Read only when WIFI is static.
WIFI_ADDRESS=""
WIFI_GATEWAY=""
WIFI_DNS=""

# The clock, read by /usr/sbin/sepia-time after the network comes up. A Pi has
# no battery-backed clock, so a card that never asks a time server thinks it is
# the moment its image was built - which is enough for TLS to work, and not
# enough to be right.
#
#   sepia-time status
#   sepia-time sync           ask now, and wait for the answer
#
# on or off. Off leaves the clock at the build date until something sets it.
NTP="on"

# Space separated. pool.ntp.org resolves to whichever servers are near, which
# is the right default for a device that could be anywhere.
NTP_SERVERS="pool.ntp.org"
