name: CI

# Every commit on every branch, every pull request against main, and the push
# that lands when a pull request is merged into main.
#
# Tag pushes deliberately do not match: `branches:` never matches a tag ref, so
# cutting a release cannot start a second pipeline for the commit it just built.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Supersede the previous run for the same branch or PR. A branch that also has
# an open PR gets one run per event in two separate groups, so neither run can
# cancel the other's checks out from under branch protection.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Hosted runners are x86_64, so the AArch64 guests run under full TCG
  # emulation - correct, but several times slower than the arm64 machine this
  # was developed on. The Makefile's 120 second default is not enough headroom,
  # and a generous cap costs nothing: each run stops as soon as its serial log
  # says what it was waiting for.
  QEMU_TIMEOUT: 300

  # The Makefile asks api.github.com which boot release to build against.
  # Unauthenticated that is 60 requests an hour *per IP*, and hosted runners
  # share their egress addresses with every other job on the platform, so the
  # budget is routinely already spent by someone else - the build then dies two
  # minutes in, right after busybox, with "GitHub API rate limit hit". The
  # automatic per-run token raises it to 1000 an hour for this repository.
  # Reading another public repository's releases works with it because they are
  # public; the token's own permissions are still only what `permissions:`
  # grants.
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  # -------------------------------------------------------------------------
  # One job, one image, every board. Deliberately not a matrix over boards:
  # this build produces a single card that is supposed to boot all four, and
  # four parallel jobs would each build their own image and so test four
  # different cards instead of the claim actually being made. (The image is not
  # byte-reproducible - mke2fs stamps a random filesystem UUID - so they really
  # would differ.) The cost is wall-clock time rather than confidence.
  # -------------------------------------------------------------------------
  build:
    name: build and boot
    runs-on: ubuntu-latest
    # 120 rather than 90 since the on-device LLVM toolchain went in: a 42 MiB
    # download, a 180 MiB unpack, and an ext4 twice the size to build and boot.
    timeout-minutes: 120
    # QEMU's raspi4b machine arrived in QEMU 9.0. Debian 12 ships 7.2 and
    # Ubuntu 24.04 ships 8.2, so on the bare runner pi4 and cm4 could not be
    # booted at all. Trixie ships QEMU 10.x. Before changing this image, check
    # `qemu-system-aarch64 -machine help | grep raspi4b`.
    container: debian:trixie-slim
    steps:
      # Before checkout on purpose: without git in the container, actions/checkout
      # silently falls back to downloading a tarball, and the Makefile needs git
      # both for the module fetch and to resolve the musl version. zstd is here
      # for actions/cache, which otherwise falls back to gzip and says so, and
      # python3 for tools/generate_keymaps.py - the one part of the build that
      # needs an interpreter - and squashfs-tools for vendor/keymaps/kmaps.tcz,
      # since a .tcz is a squashfs image and unsquashfs is what opens one.
      - name: Install build tools
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            build-essential make git curl ca-certificates \
            jq xz-utils bzip2 zstd mtools qemu-system-arm python3 squashfs-tools

      - uses: actions/checkout@v5

      # After checkout, never before: actions/checkout runs `git clean -ffdx` on
      # an existing workspace, which would delete the restored downloads.
      #
      # Worth caching because downloads/ holds a ~600 MiB cross-toolchain that
      # otherwise comes off developer.arm.com on every push. Almost everything
      # in there is keyed by an immutable version or tag, so a stale entry is
      # only ever unused rather than wrong - which is what makes the loose
      # restore-key prefix safe.
      #
      # downloads/llvm/<tag>/ is the exception, and it bit: Sepia-OS/llvm keeps
      # one release at a time and republishes under the *same* tag, so a
      # restored entry there really can be the wrong bytes. Because the
      # restore-key prefix means a changed Makefile does not invalidate the
      # entry, a run unpacked the superseded 186 MiB toolchain instead of the
      # 196 MiB release and failed llvm-check on a dependency upstream had
      # already removed. The Makefile now keys those downloads on the release
      # asset's GitHub id rather than on the tag and refetches on a mismatch,
      # so nothing here has to change for it - and downloads/make/<tag>/ is
      # keyed the same way, even though Sepia-OS/make does not reuse a tag in
      # the ordinary course, because deleting a release and republishing it is
      # what that repository's own retry advice says to do.
      #
      # In particular do not narrow the key to compensate: dropping the
      # restore-key fallback would refetch the cross-toolchain on every
      # Makefile edit to fix a problem it does not have.
      - name: Cache the downloaded upstream artifacts
        uses: actions/cache@v4
        with:
          path: downloads
          key: downloads-${{ runner.os }}-${{ hashFiles('Makefile') }}
          restore-keys: downloads-${{ runner.os }}-

      # Ahead of `make image` on purpose. The toolchain is a prerequisite of
      # the rootfs staging, which is the last thing the image build does, so a
      # toolchain that cannot be resolved or verified would otherwise surface
      # forty minutes in, after musl, busybox, the modules and the wireless
      # stack. Same documented target the build reaches later, reached sooner.
      - name: Resolve and fetch the on-device toolchain
        run: make llvm

      # Same reasoning, and the same few seconds: GNU make for the device is
      # resolved over the API and verified against the release's own digest, so
      # a repository that has published nothing - or an asset that will not
      # verify - should say so now rather than at the end of the image build.
      - name: Resolve and fetch GNU make for the device
        run: make fetch-make

      - name: Build the image
        run: make image

      - name: Show what was built
        run: |
          make image-info
          make rootfs-info
          make modules-info
          make llvm-info
          make make-info

      - name: Read the image back
        run: make image-check

      # The library closure of the shipped clang and lld against what the card
      # carries. Needs the cross-toolchain's readelf, so it is off the build
      # path and asked for here rather than being part of `make llvm`.
      - name: Read the toolchain back
        run: make llvm-check

      # The same closure check for the build driver beside it - one binary, so
      # the claim is one line: aarch64, the musl loader, and libc.so as its only
      # shared library. Needs the cross-toolchain's readelf too, so it sits here
      # rather than on the build path.
      - name: Read GNU make back
        run: make make-check

      # The README asks for smoke tests on these four boards; this is that step.
      # One image, booted as each of them, checked all the way to a login prompt.
      - name: Boot it as every board QEMU can emulate
        run: make smoke

      # Not asked for by the README, and the most valuable test here: it is the
      # only one that exercises the partition rewrite, the reboot between the
      # two passes of sepia-firstboot, the online resize and swap.
      - name: Check the first-boot resize
        run: make grow-check

      - name: Upload the serial logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: serial-logs
          path: build/qemu/*.log
          if-no-files-found: ignore
